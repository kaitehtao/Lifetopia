name: Deploy Lifetopia to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build and verify website
        run: |
          node build.mjs
          node check.mjs
          node prepare-github-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
